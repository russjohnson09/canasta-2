name: AI Review

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'The model to use with OpenCode'
        required: true
        default: 'google/gemini-flash-lite-latest'
        type: string
      run_always_fail:
        description: 'Run the always-fail job'
        required: false
        default: false
        type: boolean
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  hello:
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'ready_for_review' || github.event.pull_request.head.sha != github.event.before))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache global node modules
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      # Gemini 3.5 Flash Lite
      - name: Run OpenCode to add tests
        env:
          # GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  # https://opencode.ai/docs/cli/commands/

        run: |
          MODEL="${{ github.event.inputs.model || 'google/gemini-flash-lite-latest' }}"
          npx opencode run \
            --model "$MODEL" \
            --auto \
            "Say hello." > opencode_output.log 2>&1 || true
          cat opencode_output.log

      - name: Summarize Opencode Cost
        if: always()
        uses: ./.github/actions/summarize-cost
        with:
          model: ${{ github.event.inputs.model || 'google/gemini-flash-lite-latest' }}

  summarize-changes:
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'ready_for_review' || github.event.pull_request.head.sha != github.event.before))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache global node modules
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci


# https://github.com/russjohnson09/canasta-2/actions/runs/44996056501/job/137127225344?pr=1
# $ git branch --show-current && git log main..HEAD --oneline
# fatal: ambiguous argument 'main..HEAD': unknown revision or path not in the working tree.
# Use '--' to separate paths from revisions, like this:
# 'git <command> [<revision>...] -- [<file>...]'

# ốngốngốngốngốngốngốngốngốngốngốngốngốngốngốngốngống
# Error: Requests ending with a model turn are not supported.
# Error: Process completed with exit code 1.
      - name: Run OpenCode to add tests
        env:
          # GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  # https://opencode.ai/docs/cli/commands/

        run: |
          MODEL="${{ github.event.inputs.model || 'google/gemini-flash-lite-latest' }}"

          git diff main HEAD > diff.patch

          npx opencode run \
            --model "$MODEL" \
            --auto \
            "Write a summary of the changes in diff.patch to opencode_output.md." 

      - name: Summarize Opencode Cost
        if: always()
        uses: ./.github/actions/summarize-cost
        with:
          model: ${{ github.event.inputs.model || 'google/gemini-flash-lite-latest' }}


  always-fail:
    needs: hello
    if: ${{ github.event.inputs.run_always_fail == 'true' || github.event.inputs.run_always_fail == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache global node modules
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      # Gemini 3.5 Flash Lite
      - name: Run OpenCode to add tests
        env:
          # GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  # https://opencode.ai/docs/cli/commands/
        run: |
          MODEL="${{ github.event.inputs.model || 'google/gemini-flash-lite-latest' }}"
          npx opencode run \
            --model "$MODEL" \
            --auto \
            "Respond with FAILED" > opencode_output.log 2>&1 || true
          cat opencode_output.log
          if ! grep -q "SUCCESS" opencode_output.log; then
            echo "Error: OpenCode run output did not contain SUCCESS."
            exit 1
          fi

      - name: Summarize Opencode Cost
        if: always()
        uses: ./.github/actions/summarize-cost
        with:
          model: ${{ github.event.inputs.model || 'google/gemini-flash-lite-latest' }}
