name: Hello

on:
  # schedule:
  #   # Runs every Monday & Thursday at 04:00 UTC (low-traffic window)
  #   - cron: "0 4 * * 1,4"
  workflow_dispatch: # Lets you test manually from the Actions tab
    inputs:
      model:
        description: 'The model to use with OpenCode'
        required: true
        default: 'google/gemini-flash-lite-latest'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  hello:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: Skip if an automated coverage PR is already open
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     OPEN_PRS=$(gh pr list --label "auto-coverage" --state open --json number --jq 'length')
      #     if [ "$OPEN_PRS" -gt "0" ]; then
      #       echo "Coverage PR already open, skipping."
      #       exit 0
      #     fi

      # # Replace with your language/runtime setup & coverage command
      # - name: Run baseline coverage
      #   run: |
      #     npm ci
      #     npx vitest run --coverage --reporter=json > coverage-summary.txt || true

      - name: Install OpenCode
        run: npm install -g opencode-ai

      # Gemini 3.5 Flash Lite
      - name: Run OpenCode to add tests
        env:
          # GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          MODEL="${{ github.event.inputs.model || 'google/gemini-flash-lite-latest' }}"
          opencode run \
            --model "$MODEL" \
            --auto \
            "Say hello."

      - name: Summarize Opencode Cost
        if: always()
        run: |
          MODEL="${{ github.event.inputs.model || 'google/gemini-flash-lite-latest' }}"
          echo "### Opencode Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Model: $MODEL" >> $GITHUB_STEP_SUMMARY
          echo "- Prompt Tokens: ~150" >> $GITHUB_STEP_SUMMARY
          echo "- Completion Tokens: ~50" >> $GITHUB_STEP_SUMMARY
          echo "- Total Tokens: ~200" >> $GITHUB_STEP_SUMMARY
          echo "- Estimated Cost: \$0.00003" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "For more details, see [Opencode Cost Documentation](./docs/opencode.md)." >> $GITHUB_STEP_SUMMARY

      # - name: Create Pull Request
      #   uses: peter-evans/create-pull-request@v7
      #   with:
      #     token: ${{ secrets.GITHUB_TOKEN }}
      #     branch: chore/auto-coverage
      #     title: "test: improve unit test coverage"
      #     body: "Automated PR generated by scheduled OpenCode coverage run."
      #     labels: auto-coverage