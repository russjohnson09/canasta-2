name: Hello

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'The model to use with OpenCode'
        required: true
        default: 'google/gemini-flash-lite-latest'
        type: string
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  hello:
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'ready_for_review' || github.event.pull_request.head.sha != github.event.before))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: Skip if an automated coverage PR is already open
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     OPEN_PRS=$(gh pr list --label "auto-coverage" --state open --json number --jq 'length')
      #     if [ "$OPEN_PRS" -gt "0" ]; then
      #       echo "Coverage PR already open, skipping."
      #       exit 0
      #     fi

      # # Replace with your language/runtime setup & coverage command
      # - name: Run baseline coverage
      #   run: |
      #     npm ci
      #     npx vitest run --coverage --reporter=json > coverage-summary.txt || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache global node modules
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install OpenCode
        run: npm install -g opencode-ai

      # Gemini 3.5 Flash Lite
      - name: Run OpenCode to add tests
        env:
          # GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  # https://opencode.ai/docs/cli/commands/

        run: |
          MODEL="${{ github.event.inputs.model || 'google/gemini-flash-lite-latest' }}"
          opencode run \
            --model "$MODEL" \
            --auto \
            "Say hello."

      - name: Summarize Opencode Cost
        if: always()
        run: |
          MODEL="${{ github.event.inputs.model || 'google/gemini-flash-lite-latest' }}"
          echo "### Opencode Execution Summary" >> $GITHUB_STEP_SUMMARY

          STATS_OUTPUT=$(opencode stats 2>&1 || echo "Stats unavailable")
          MODELS_OUTPUT=$(opencode stats --models 2>&1 || echo "Stats unavailable")
          COST_OUTPUT=$(opencode stats --cost 2>&1 || echo "Stats unavailable")
          echo "$STATS_OUTPUT"
          echo "$MODELS_OUTPUT"
          echo "$COST_OUTPUT"

          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$STATS_OUTPUT" >> $GITHUB_STEP_SUMMARY
          echo "$MODELS_OUTPUT" >> $GITHUB_STEP_SUMMARY
          echo "$COST_OUTPUT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "For more details, see [Opencode Cost Documentation](./docs/opencode.md)." >> $GITHUB_STEP_SUMMARY


      # - name: Create Pull Request
      #   uses: peter-evans/create-pull-request@v7
      #   with:
      #     token: ${{ secrets.GITHUB_TOKEN }}
      #     branch: chore/auto-coverage
      #     title: "test: improve unit test coverage"
      #     body: "Automated PR generated by scheduled OpenCode coverage run."
      #     labels: auto-coverage